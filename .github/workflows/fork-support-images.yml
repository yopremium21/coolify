name: Build Fork Support Images

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - docker/coolify-helper/**
      - docker/coolify-realtime/**
      - .github/workflows/fork-support-images.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: helper
            image: ghcr.io/yopremium21/coolify-helper
            tag: 1.0.16
            dockerfile: docker/coolify-helper/Dockerfile
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: helper
            image: ghcr.io/yopremium21/coolify-helper
            tag: 1.0.16
            dockerfile: docker/coolify-helper/Dockerfile
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: realtime
            image: ghcr.io/yopremium21/coolify-realtime
            tag: 1.0.18
            dockerfile: docker/coolify-realtime/Dockerfile
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: realtime
            image: ghcr.io/yopremium21/coolify-realtime
            tag: 1.0.18
            dockerfile: docker/coolify-realtime/Dockerfile
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ matrix.image }}:${{ matrix.tag }}-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: ghcr.io/yopremium21/coolify-helper
            tag: 1.0.16
          - image: ghcr.io/yopremium21/coolify-realtime
            tag: 1.0.18
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish multi-arch manifest
        run: |
          docker buildx imagetools create \
            "${{ matrix.image }}:${{ matrix.tag }}-amd64" \
            "${{ matrix.image }}:${{ matrix.tag }}-arm64" \
            --tag "${{ matrix.image }}:${{ matrix.tag }}"
